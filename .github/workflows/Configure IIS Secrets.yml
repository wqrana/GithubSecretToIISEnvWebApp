name: Configure IIS Secrets

on:
  workflow_dispatch:

jobs:
  configure-iis:
    runs-on: self-hosted
    environment: Development

    env:
      APP_POOL_NAME: GitHubSecretsWeb

    steps:
      - name: Configure IIS App Pool Environment Variables
        shell: powershell
        env:
          DB_CONNECTION: ${{ secrets.DBCONNECTION }}
          APP_URL: ${{ secrets.AppURL }}
          API_KEY: ${{ secrets.APIKEY }}

        run: |
          Import-Module WebAdministration

          function Set-IisAppPoolEnvironmentVariable {
              param(
                  [Parameter(Mandatory = $true)]
                  [string]$AppPoolName,

                  [Parameter(Mandatory = $true)]
                  [string]$VariableName,

                  [Parameter(Mandatory = $true)]
                  [string]$VariableValue
              )

              $filter = "system.applicationHost/applicationPools/add[@name='$AppPoolName']/environmentVariables"

              $existingVariable = Get-WebConfiguration `
                  -PSPath 'MACHINE/WEBROOT/APPHOST' `
                  -Filter "$filter/add[@name='$VariableName']" `
                  -ErrorAction SilentlyContinue

              if ($existingVariable) {

                  Write-Host "Updating IIS environment variable: $VariableName"

                  Set-WebConfigurationProperty `
                      -PSPath 'MACHINE/WEBROOT/APPHOST' `
                      -Filter "$filter/add[@name='$VariableName']" `
                      -Name "value" `
                      -Value $VariableValue
              }
              else {

                  Write-Host "Creating IIS environment variable: $VariableName"

                  Add-WebConfigurationProperty `
                      -PSPath 'MACHINE/WEBROOT/APPHOST' `
                      -Filter $filter `
                      -Name "." `
                      -Value @{
                          name  = $VariableName
                          value = $VariableValue
                      }
              }
          }

          $appPoolName = $env:APP_POOL_NAME

          Set-IisAppPoolEnvironmentVariable `
              -AppPoolName $appPoolName `
              -VariableName "ConnectionStrings__DefaultConnection" `
              -VariableValue $env:DB_CONNECTION

          Set-IisAppPoolEnvironmentVariable `
              -AppPoolName $appPoolName `
              -VariableName "AppURL" `
              -VariableValue $env:APP_URL

          Set-IisAppPoolEnvironmentVariable `
              -AppPoolName $appPoolName `
              -VariableName "APIKey" `
              -VariableValue $env:API_KEY

      - name: Restart IIS App Pool
        shell: powershell
        run: |
          Import-Module WebAdministration

          $appPoolName = $env:APP_POOL_NAME

          Write-Host "Restarting App Pool: $appPoolName"

          if ((Get-WebAppPoolState -Name $appPoolName).Value -eq "Started") {
              Restart-WebAppPool -Name $appPoolName
          }
          else {
              Start-WebAppPool -Name $appPoolName
          }
